<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 512 512"><style>.m-road,.m-team{stroke-dasharray:100;stroke-dashoffset:100;animation:m-draw 2.6s cubic-bezier(.6,0,.2,1) infinite}.m-team{animation-name:m-team}.m-gem{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:m-gem 2.6s infinite}.m-all{animation:m-fade 2.6s infinite}@keyframes m-draw{0%{stroke-dashoffset:100}35%,100%{stroke-dashoffset:0}}@keyframes m-team{0%,25%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}@keyframes m-gem{0%,50%{transform:scale(0)}62%{transform:scale(1.15)}70%,100%{transform:scale(1)}}@keyframes m-fade{0%,86%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.m-road,.m-team,.m-gem,.m-all{animation:none;stroke-dashoffset:0;transform:none;opacity:1}}</style><rect width="512" height="512" rx="112" fill="#005751"/><g class="m-all" transform="translate(-6 -32)"><path class="m-road" pathLength="100" d="M98 398 L208 288 L268 348 L364 252" fill="none" stroke="#fff" stroke-width="74" stroke-linejoin="miter" stroke-miterlimit="10"/><path class="m-team" pathLength="100" d="M350.6 392.6 L446.6 296.6" fill="none" stroke="#5fc4b5" stroke-width="74"/><path class="m-gem" fill="#5fc4b5" d="M402 138L464 200L402 262L340 200Z"/></g></svg>
