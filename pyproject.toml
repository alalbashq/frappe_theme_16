[project]
name = "advanced_workspace"
authors = [
    { name = "Albashq Alshwmy", email = "al.alshwmy@gmail.com"}
]
description = "Arabic workspace with a user and a manager role for every module"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
